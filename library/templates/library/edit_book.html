{% extends "library/base.html" %}
{% block content %}
<div class="page-shell" style="max-width:700px;">
    <div class="page-header"><h1>✏️ Edit Book</h1></div>
    <div class="panel">
        <form method="post" class="form-grid">
            {% csrf_token %}
            <label>Title *<input type="text" name="title" value="{{ book.title }}" required></label>
            <label>Author<input type="text" name="author" value="{{ book.author }}"></label>
            <label>ISBN<input type="text" name="isbn" value="{{ book.isbn }}"></label>
            <label>Category
                <select name="category">
                    {% for value, label in category_choices %}
                        <option value="{{ value }}" {% if book.category == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Publisher<input type="text" name="publisher" value="{{ book.publisher }}"></label>
            <label>Edition<input type="text" name="edition" value="{{ book.edition }}"></label>
            <label>Shelf Location<input type="text" name="shelf_location" value="{{ book.shelf_location }}"></label>
            <label>Total Copies<input type="number" name="total_copies" min="0" value="{{ book.total_copies }}"></label>
            <div style="grid-column:1/-1; margin-top:10px;">
                <span class="badge {% if book.is_available %}success{% else %}danger{% endif %}">{{ book.available_copies }} of {{ book.total_copies }} currently available</span>
            </div>
            <div style="grid-column:1/-1; margin-top:10px;">
                <button type="submit" class="btn success">Save Changes</button>
                <a href="{% url 'library:book_list' %}" class="btn ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
