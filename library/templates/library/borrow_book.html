{% extends "library/base.html" %}
{% block content %}
<div class="page-shell" style="max-width:700px;">
    <div class="page-header"><h1>📖 Issue Book</h1></div>
    <div class="panel">
        <form method="post" class="form-grid">
            {% csrf_token %}
            <label>Book *
                <select name="book_id" required>
                    <option value="">-- Select Book --</option>
                    {% for book in books %}
                        <option value="{{ book.id }}">{{ book.title }} ({{ book.available_copies }} available)</option>
                    {% endfor %}
                </select>
            </label>
            <label>Student *
                <select name="student_id" required>
                    <option value="">-- Select Student --</option>
                    {% for s in students %}
                        <option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }} ({{ s.registration_number }})</option>
                    {% endfor %}
                </select>
            </label>
            <label>Due in (days)<input type="number" name="due_days" value="14" min="1"></label>
            <div style="grid-column:1/-1; margin-top:10px;">
                <button type="submit" class="btn success">Issue Book</button>
                <a href="{% url 'library:library_dashboard' %}" class="btn ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
