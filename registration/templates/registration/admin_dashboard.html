<h2>Registration Admin Dashboard</h2>

<h3>Pending Users</h3>

<table border="1">
<tr>
    <th>Username</th>
    <th>Action</th>
</tr>

{% for um in pending_users %}
<tr>
    <td>{{ um.user.username }}</td>
    <td>
        <a href="{% url 'approve_user_registration' um.id %}">
            Approve
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="2">No pending users</td>
</tr>
{% endfor %}
</table>
